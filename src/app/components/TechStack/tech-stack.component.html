<section class="tech-stack">
  <div class="tech-stack__header">
    <div class="tech-stack__header__titles">
      <span class="tech-stack__header__titles__subtitle"> Capabilities </span>

      <h2 class="tech-stack__header__titles__title">Tech Stack</h2>
    </div>

    <!-- tech stack filters -->
    <div class="tech-stack__filters" aria-label="Filter tech stack">
      @for (filter of techFilters; track filter.id) {
        <button
          type="button"
          class="tech-stack__filters__filter-button"
          [class.tech-stack__filters__filter-button--active]="activeTechFilter() === filter.id"
          [attr.aria-pressed]="activeTechFilter() === filter.id"
          (click)="activeTechFilter.set(filter.id)"
        >
          {{ filter.label }}
        </button>
      }
    </div>
  </div>

  <!-- badges -->
  <div class="tech-stack__list">
    @for (tech of filteredTechStack(); track tech.id) {
      <div class="tech-stack__list__badge">
        <i
          [class]="tech.icon + ' ' + tech.colorClass + ' tech-stack__list__badge__icon'"
          aria-hidden="true"
        ></i>

        <span class="tech-stack__list__badge__name">
          {{ tech.name }}
        </span>
      </div>
    }
  </div>
</section>
