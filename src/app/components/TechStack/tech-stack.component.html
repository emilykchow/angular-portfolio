<section class="tech-section">
  <div class="section-header">
    <div class="section-header__titles">
      <span class="section-title"> Capabilities </span>

      <h2 class="section-header__title">Tech Stack</h2>
    </div>

    <!-- Technology filters -->
    <div class="tech-filters" aria-label="Filter technologies">
      @for (filter of techFilters; track filter.id) {
        <button
          type="button"
          class="filter-button"
          [class.filter-button--active]="activeTechFilter() === filter.id"
          [attr.aria-pressed]="activeTechFilter() === filter.id"
          (click)="activeTechFilter.set(filter.id)"
        >
          {{ filter.label }}
        </button>
      }
    </div>
  </div>

  <!-- badges -->
  <div class="tech-grid">
    @for (tech of filteredTechStack(); track tech.id) {
      <div class="tech-badge">
        <i [class]="tech.icon + ' ' + tech.colorClass + ' tech-badge__icon'" aria-hidden="true"></i>

        <span class="tech-badge__name">
          {{ tech.name }}
        </span>
      </div>
    }
  </div>
</section>
