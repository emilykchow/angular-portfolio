<section class="games">
  <div class="games__heading">
    <h2 class="games__heading__title">
      <i class="fas fa-gamepad" aria-hidden="true"></i>
      Current Game Rotation
    </h2>

    <span class="games__heading__meta"> PC and PS5 </span>
  </div>

  <div class="games__list">
    @for (game of gameRotation; track game.id) {
      <article class="games__list__card">
        <div class="games__list__card__image-wrapper">
          <img [src]="game.image" [alt]="game.title" class="games__list__card__image" />

          <div class="games__list__card__image-overlay"></div>
        </div>

        <div class="games__list__card__badge">
          {{ game.badge }}
        </div>

        <div class="games__list__card__details">
          <h3 class="games__list__card__title">
            {{ game.title }}
          </h3>

          <div class="games__list__card__metadata">
            <span>{{ game.genre }}</span>
            <span class="games__list__card__platform">
              {{ game.platform }}
            </span>
          </div>
        </div>
      </article>
    }
  </div>
</section>
