<header class="hero">
  <!-- profile picture -->
  <div class="hero__profile">
    <div class="hero__profile__ring">
      <div class="hero__profile__image">
        <img src="/assets/images/cropped-linkedin-profile.jpg" alt="Emily Chow Profile Picture" />
      </div>
    </div>

    <!-- online status -->
    <div class="hero__profile__status" title="Open for Collaboration">
      <span class="hero__profile__status__ping"></span>
      <span class="hero__profile__status__dot"></span>
    </div>
  </div>

  <!-- social links -->
  <nav class="hero__socials" aria-label="Social profiles">
    <a
      href="https://www.linkedin.com/in/echowk/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn Profile"
    >
      <i class="fab fa-linkedin-in" aria-hidden="true"></i>
    </a>

    <a
      href="https://github.com/emilykchow"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub Profile"
    >
      <i class="fab fa-github" aria-hidden="true"></i>
    </a>

    <a
      href="mailto:emilykchow@outlook.com"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Email Contact"
    >
      <i class="fa-solid fa-envelope"></i>
    </a>
  </nav>
</header>
