<div
  class="portfolio"
  [class.portfolio--dark]="isDarkMode()"
  [class.portfolio--light]="!isDarkMode()"
>
  <button
    type="button"
    class="theme-toggle"
    [attr.aria-pressed]="!isDarkMode()"
    [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="toggleTheme()"
  >
    <i
      class="fa-solid"
      [class.fa-sun]="isDarkMode()"
      [class.fa-moon]="!isDarkMode()"
      aria-hidden="true"
    ></i>
    {{ isDarkMode() ? 'Light mode' : 'Dark mode' }}
  </button>

  <!-- ambient background glow -->
  <div class="ambient-glow-background ambient-glow-background__top"></div>

  <div class="ambient-glow-background ambient-glow-background__bottom"></div>

  <!-- main content -->
  <main class="portfolio__main">
    <div class="portfolio__frame">
      <hero-component></hero-component>

      <!-- about me -->
      <about-component></about-component>

      <!-- games -->
      <games-component></games-component>

      <!-- work experience -->
      <work-component></work-component>

      <!-- projects -->
      <projects-component></projects-component>

      <!-- tech stack -->
      <tech-stack-component></tech-stack-component>
    </div>

    <!-- footer -->
    <footer-component></footer-component>
  </main>
</div>

<router-outlet />
